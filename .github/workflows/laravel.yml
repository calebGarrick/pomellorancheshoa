name: Build and Release

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install PHP deps
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare Laravel caches
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan optimize

      - name: Create release branch
        run: git checkout -B release

      - name: Commit build artifacts
        run: |
          git add -f vendor public/build bootstrap/cache
          git commit -m "Build release $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"

      - name: Tag and push
        run: |
          VERSION="v$(date +'%Y.%m.%d.%H%M')"
          git tag -f "$VERSION"
          git push origin release --tags --force

      - name: Run remote commands
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: pomellorancheshoa.com
          username: serfcnte
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            (
              set -e

              APP_DIR="$HOME/pomellorancheshoa"
              PUBLIC_DIR="$HOME/public_html"

              if [ ! -d "$APP_DIR/.git" ]; then
                APP_DIR="$PUBLIC_DIR"
              fi

              cd "$APP_DIR"
              git merge --abort >/dev/null 2>&1 || true
              git rebase --abort >/dev/null 2>&1 || true
              git fetch origin release --prune
              git checkout -B release origin/release
              git reset --hard origin/release
              php /opt/cpanel/composer/bin/composer install --no-dev -q

              if [ ! -f .env ] && [ -f "$HOME/.env" ]; then
                cp "$HOME/.env" .env
              fi

              if [ ! -f .env ]; then
                echo "Deployment error: missing .env in $APP_DIR and $HOME/.env" >&2
                exit 1
              fi

              if ! grep -q '^APP_KEY=base64:' .env; then
                echo "Deployment error: APP_KEY is missing in .env" >&2
                exit 1
              fi

              php artisan config:clear
              php artisan route:clear
              php artisan view:clear
              php artisan event:clear
              php artisan optimize

              mkdir -p "$PUBLIC_DIR"
              cp -a public/. "$PUBLIC_DIR/"

              {
                echo '<?php'
                echo
                echo 'use Illuminate\Foundation\Application;'
                echo 'use Illuminate\Http\Request;'
                echo
                echo "define('LARAVEL_START', microtime(true));"
                echo
                echo "\$projectPath = getenv('LARAVEL_PROJECT_PATH') ?: '${APP_DIR}';"
                echo
                echo "if (file_exists(\$maintenance = \$projectPath.'/storage/framework/maintenance.php')) {"
                echo '    require $maintenance;'
                echo '}'
                echo
                echo "require \$projectPath.'/vendor/autoload.php';"
                echo
                echo '/** @var Application $app */'
                echo "\$app = require_once \$projectPath.'/bootstrap/app.php';"
                echo '$app->handleRequest(Request::capture());'
              } > "$PUBLIC_DIR/index.php"
            ) < /dev/null
            kill -9 $SSH_AGENT_PID || true
            exit 0
